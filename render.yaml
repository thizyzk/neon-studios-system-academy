services:
  - type: web
    name: neon-studios-system-academy
    runtime: node
    plan: free
    region: virginia
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: AUTH_SESSION_SECRET
        generateValue: true
      - key: AUTH_SESSION_MAX_AGE_SECONDS
        value: "604800"
      - key: AUTH_RATE_LIMIT_MAX
        value: "8"
      - key: AUTH_RATE_LIMIT_WINDOW_SECONDS
        value: "600"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_ALLOWED_EMAIL_DOMAIN
        value: ""
      - key: RECAPTCHA_SITE_KEY
        sync: false
      - key: RECAPTCHA_SECRET_KEY
        sync: false
      - key: RECAPTCHA_VERSION
        value: v3
      - key: RECAPTCHA_ACTION
        value: login
      - key: RECAPTCHA_MINIMUM_SCORE
        value: "0.5"
      - key: RECAPTCHA_ALLOWED_HOSTNAMES
        value: neon-studios-system-academy.onrender.com
